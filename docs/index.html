<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>mr trace</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>:root{
  --paper:oklch(97.5% 0.008 85);--paper-2:oklch(95% 0.012 85);--rule:oklch(88% 0.012 85);
  --ink:oklch(24% 0.02 260);--ink-2:oklch(42% 0.02 260);--ink-3:oklch(58% 0.015 260);
  --ok:oklch(58% 0.13 150);--ok-bg:oklch(93% 0.05 150);
  --bad:oklch(57% 0.18 30);--bad-bg:oklch(93% 0.045 30);
  --warn:oklch(68% 0.14 70);--warn-bg:oklch(94% 0.05 80);
  --plan:oklch(55% 0.1 245);--plan-bg:oklch(93% 0.03 245);
  --rev:oklch(52% 0.13 305);--rev-bg:oklch(93% 0.035 305);
  --idle:oklch(70% 0.01 260);
  --serif:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"IBM Plex Sans","Segoe UI","Helvetica Neue",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.92em}
.app{display:grid;grid-template-columns:minmax(380px,460px) 1fr;height:100vh}
/* board */
.board{border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0;background:var(--paper-2)}
.brand{padding:18px 20px 6px;display:flex;align-items:baseline;gap:10px}
.brand h1{font:600 22px/1 var(--serif);margin:0;letter-spacing:-.01em}
.brand .live{font-size:11px;color:var(--ink-3);margin-left:auto}
.brand .live b{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:1px}
.brand .live.off b{background:var(--idle)}
.stats{display:flex;flex-wrap:wrap;gap:4px 16px;padding:6px 20px 12px;color:var(--ink-2);font-size:12.5px}
.stats strong{color:var(--ink);font-weight:600}
.filters{display:flex;gap:6px;padding:0 20px 12px;flex-wrap:wrap}
.filters button,.filters select,.filters input{font:inherit;font-size:12.5px;border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:6px;padding:4px 9px;cursor:pointer}
.filters input{cursor:text;flex:1;min-width:110px}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.list{overflow:auto;flex:1;padding-bottom:30px}
.day{position:sticky;top:0;background:var(--paper-2);padding:10px 20px 4px;font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);z-index:1}
.row{display:grid;grid-template-columns:10px 1fr 158px;gap:4px 12px;padding:10px 20px;cursor:pointer;border-left:3px solid transparent}
.row:hover{background:oklch(93% 0.012 85)}
.row.sel{background:var(--paper);border-left-color:var(--ink)}
.pip{width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--idle)}
.st-accepted .pip{background:var(--ok)}.st-needs_human .pip{background:var(--warn)}
.st-exhausted .pip,.st-unsafe .pip,.st-no_end_record .pip,.st-review_failed .pip{background:var(--bad)}
.st-running .pip{background:var(--plan);animation:pulse 1.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 oklch(55% 0.1 245/.5)}100%{box-shadow:0 0 0 8px oklch(55% 0.1 245/0)}}
.row .t{font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .m{grid-column:2;color:var(--ink-3);font-size:12px}
.row .g{grid-row:1/span 2;grid-column:3;text-align:right;font-size:12px;color:var(--ink-2)}
.row .g svg{display:block;margin-left:auto;margin-bottom:3px}
/* detail */
.detail{overflow:auto;min-height:0}
.wrap{max-width:1100px;padding:28px 40px 80px}
.crumb{color:var(--ink-3);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap}
h2.title{font:500 clamp(22px,2.2vw,30px)/1.2 var(--serif);margin:6px 0 10px;letter-spacing:-.01em;max-width:62ch}
.headline{font-size:16px;padding:10px 14px;border-radius:8px;display:inline-block;margin-bottom:14px}
.h-accepted{background:var(--ok-bg)}.h-needs_human{background:var(--warn-bg)}
.h-exhausted,.h-unsafe,.h-no_end_record,.h-review_failed{background:var(--bad-bg)}.h-running{background:var(--plan-bg)}.h-interrupted{background:oklch(92% 0.005 260)}
.facts{display:flex;flex-wrap:wrap;gap:6px 22px;margin:4px 0 22px;color:var(--ink-2);font-size:13px}
.facts span b{color:var(--ink);font-weight:600}
.ladder-legend{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.rg{font-family:var(--mono);font-size:11.5px;padding:1px 6px;border-radius:4px;border:1px solid var(--rule);color:var(--ink-3)}
.rg.used{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rg.final{outline:2px solid var(--ok);outline-offset:1px}
.arrow{color:var(--ink-3)}
section{margin-top:26px}
section>h3{font:600 11px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}
.chart{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:8px 6px 4px}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--sans)}
.why{margin-top:10px;font-size:13px;color:var(--ink-2)}
.why b{color:var(--bad);font-weight:600}
/* steps */
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.step{display:grid;grid-template-columns:34px 1fr;gap:0 12px;position:relative;padding-bottom:18px}
.step:before{counter-increment:s;content:counter(s);font:600 12px var(--mono);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:1.5px solid var(--idle);color:var(--ink-2);z-index:1}
.step:after{content:"";position:absolute;left:12px;top:24px;bottom:0;width:1.5px;background:var(--rule)}
.step:last-child:after{display:none}
.step.ok:before{border-color:var(--ok);color:var(--ok)}
.step.bad:before{border-color:var(--bad);color:var(--bad)}
.step.ev:before{content:"";width:10px;height:10px;margin:7px;border:none;background:var(--warn);transform:rotate(45deg);border-radius:2px}
.step.ev{padding-bottom:12px;color:var(--ink-2);font-size:13px}
.sl{font-weight:500}
.sl .role{font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;margin-right:6px;vertical-align:1px}
.role-planner{background:var(--plan-bg);color:var(--plan)}.role-implementer{background:var(--ok-bg);color:oklch(42% 0.1 150)}.role-reviewer{background:var(--rev-bg);color:var(--rev)}
.sub{color:var(--ink-3);font-size:12.5px;margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 14px}
.sig{display:inline-flex;gap:4px}
.sig i{font-style:normal;font:600 11px var(--mono);padding:1px 5px;border-radius:4px;background:oklch(93% 0.005 260);color:var(--ink-3)}
.sig i.y{background:var(--ok-bg);color:oklch(40% 0.11 150)}.sig i.n{background:var(--bad-bg);color:var(--bad)}
.fail{margin-top:6px;font-size:13px;color:var(--ink-2)}
.fail b{color:var(--bad)}
.push{margin-top:6px;padding:8px 12px;background:var(--warn-bg);border-radius:6px;font-size:13px}
.tools{margin-top:8px;display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.tools i{width:7px;height:16px;border-radius:2px;display:inline-block;background:var(--idle)}
.tools i.k-read{background:oklch(70% 0.08 245)}.tools i.k-search{background:oklch(78% 0.05 245)}
.tools i.k-edit{background:var(--ok)}.tools i.k-shell{background:var(--warn)}.tools i.k-web{background:var(--rev)}
.tools i.k-say{width:3px;background:oklch(80% 0.01 260)}.tools i.k-plan{background:oklch(75% 0.06 300)}
.tcount{font-size:12px;color:var(--ink-3);margin-left:8px}
details{margin-top:6px;font-size:13px}
details summary{cursor:pointer;color:var(--ink-3);font-size:12.5px}
details .said{white-space:pre-wrap;background:var(--paper-2);padding:8px 12px;border-radius:6px;margin-top:4px;max-height:260px;overflow:auto}
.toollist{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);max-height:260px;overflow:auto;background:var(--paper-2);padding:6px 10px;border-radius:6px;margin-top:4px}
.toollist div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paths{font:11.5px var(--mono);color:var(--ink-3);margin-top:6px;word-break:break-all}
.empty{padding:80px 40px;color:var(--ink-3);font:italic 18px var(--serif)}
.keys{color:var(--ink-3);font-size:11.5px;padding:8px 20px;border-top:1px solid var(--rule)}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr);height:auto}.board{max-height:none;border-right:0;border-bottom:1px solid var(--rule)}.list{max-height:62vh;flex:none}.detail{overflow:visible;min-width:0}.wrap{padding:18px 14px 60px;max-width:100vw}.wrap>*{max-width:100%}.chart,.climb{overflow-x:auto}}
@media (max-width:520px){.row{grid-template-columns:10px 1fr 132px;padding:10px 12px}.summary{padding:4px 12px 12px}.brand{padding-left:12px!important;padding-right:12px!important}}
@media (prefers-reduced-motion:reduce){.st-running .pip{animation:none}}
.untitled{font-style:italic;color:var(--ink-2)}.untitled small{font:400 13px var(--sans);color:var(--ink-3);font-style:normal}
.whyline{font-size:13px;color:var(--ink-2);margin-top:4px;max-width:90ch}
.gl{display:flex;align-items:center;justify-content:flex-end;gap:5px}
.gl svg{margin:0!important}
.mx{font:600 10.5px var(--mono);color:var(--ink-2);min-width:26px;text-align:left}
.tb{display:block;margin:3px 31px 3px auto}
.na{color:var(--ink-3);font-style:italic}
.tag{font-size:11px;padding:0 6px;border-radius:9px;background:var(--plan-bg);color:var(--plan);white-space:nowrap}
.summary{display:grid;grid-template-columns:1.25fr 1fr;gap:10px 18px;padding:4px 20px 14px;border-bottom:1px solid var(--rule);margin-bottom:4px}
.summary .sm:first-child{grid-column:span 2}
.summary h4{margin:0 0 4px;font:600 10px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.fb{display:grid;grid-template-columns:84px 1fr 14px;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);line-height:1.5}
.fb i{display:block;height:6px;background:var(--bad);border-radius:2px;opacity:.8}.fb b{font-weight:600;color:var(--ink)}
.split{display:flex;height:7px;border-radius:3px;overflow:hidden;width:100%}.split i{display:block}
.lg{display:flex;flex-direction:column;gap:0;font-size:11.5px;color:var(--ink-2);margin-top:3px}.lg b{color:var(--ink)}
</style></head>

  });
  // ticks
  for(let k=0;k<=4;k++){ const v=t0+span*k/4, x=X(v);
    g+=`<line x1="${x}" x2="${x}" y1="${top}" y2="${top+rows.length*rh}" stroke="var(--rule)" stroke-dasharray="2 4"/>`;
    g+=`<text x="${x}" y="${H-8}" font-size="11" text-anchor="${k===0?"start":k===4?"end":"middle"}" fill="var(--ink-3)" font-family="var(--mono)">${fmtClock(v)}${k?` (+${dur(v-t0)})`:""}</text>`; }
  // where time went: model time vs mr's own checks
  const ay=top+rows.length*rh+8;
  g+=`<rect x="${L}" y="${ay}" width="${W-L-R}" height="6" fill="url(#hatch)"/>`;
  for(const s of steps) g+=`<rect x="${X(s.t0)}" y="${ay}" width="${Math.max(X(s.t1||t1)-X(s.t0),1)}" height="6" fill="var(--ink-3)"/>`;
  g+=`<text x="${W-R}" y="${ay+20}" font-size="10.5" text-anchor="end" fill="var(--ink-3)">bottom strip: ▮ a model was working · ▨ mr's own checks, tests, git</text>`;
  // path: every hand-off between consecutive steps (dashed = the previous step failed)
  for(let i=1;i<steps.length;i++){ const a=steps[i-1], b=steps[i];
    const x1=X(a.t1||a.t0), y1=Y(a.rung)+rh/2, x2=X(b.t0), y2=Y(b.rung)+rh/2;
    if(a.rung===b.rung && x2-x1<4) continue;
    const mx=Math.max(x1,x2)+0, c=(y1===y2)?`M${x1} ${y1} L${x2} ${y2}`:`M${x1} ${y1} C ${x1+18} ${y1}, ${x2-18} ${y2}, ${x2} ${y2}`;
    g+=`<path d="${c}" fill="none" stroke="${a.ok===false?"var(--bad)":"var(--ink-3)"}" stroke-width="1.4" stroke-dasharray="${a.ok===false?"4 3":"0"}" opacity=".8"/>`; }
  // bars
  for(const s of steps){
    const x=X(s.t0), w=Math.max(X(s.t1||t1)-x,3), y=Y(s.rung)+8, h=rh-16, col=stepColor(s);
    const lab=`${VERB[s.role]||s.role} · ${dur((s.t1||t1)-s.t0)}`;
    g+=`<g class="bar" data-i="${s.idx}"><title>${esc(s.line)}</title><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${col}" ${s.live?'opacity=".75"':""}/>`;
    if(w>lab.length*6.6+16) g+=`<text x="${x+8}" y="${y+h/2+4}" font-size="12" font-weight="500" fill="var(--paper)">${esc(lab)}</text>`;
    else { const right = x+w+130 > W; g+=`<text x="${right?x-5:x+w+5}" y="${y+h/2+4}" font-size="11.5" text-anchor="${right?"end":"start"}" fill="var(--ink-2)">${esc(lab)}</text>`; }
    if(!s.ok && !s.live){ const f=`✕ ${s.role==="reviewer"?"review said no":(s.failure_class||s.decision||"failed")}`, right = x+w+140 > W;
      g+=`<text x="${right?x+w:x}" y="${y-2}" font-size="11" font-weight="600" text-anchor="${right?"end":"start"}" fill="var(--bad)">${esc(f)}</text>`; }
    g+=`</g>`;
  }
  // gate / advisor events
  for(const e of t.events||[]){ if(!e.t) continue; const x=X(e.t);
    const c=e.kind==="guard"?(e.allow?"var(--ok)":"var(--bad)"):"var(--rev)";
    g+=`<g><title>${esc(fmtClock(e.t)+" "+e.label)}</title><rect x="${x-5}" y="${top-14}" width="10" height="10" transform="rotate(45 ${x} ${top-9})" fill="${c}"/></g>`; }
  return g+"</svg>";
}

/* ---------- detail ---------- */
function sig(v){ if(v===true||v==="pass") return "y"; if(v===false||(typeof v==="string"&&v.startsWith("fail"))) return "n"; return ""; }
const SIGNAME={H:"Hygiene (typecheck/lint/existing tests)",D:"Diff stayed in scope and size",A:"Acceptance tests",C:"Cross-family review"};
function toolStrip(tools){
  if(!tools||!tools.length) return "";
  const c={}; for(const x of tools) if(x.kind!=="say") c[x.name]=(c[x.name]||0)+1;
  const counts=Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${esc(k)} ${v}`).join(" · ");
  return `<div class="tools" aria-label="tool calls in order">${tools.map(x=>`<i class="k-${esc(x.kind)}" title="${esc(x.name+(x.hint?": "+x.hint:""))}"></i>`).join("")}<span class="tcount">${counts}</span></div>
  <details><summary>${tools.filter(x=>x.kind!=="say").length} tool calls, in order</summary><div class="toollist">${tools.map(x=>x.kind==="say"?`<div style="color:var(--ink-3)">“${esc(x.hint)}”</div>`:`<div><b>${esc(x.name)}</b> ${esc(x.hint||"")}</div>`).join("")}</div></details>`;
}
function stepCard(s){
  const sg=["H","D","A","C"].map(k=>`<i class="${sig(s.signals[k])}" title="${esc(SIGNAME[k]+": "+(s.signals[k]??"not run"))}">${k}${sig(s.signals[k])==="y"?"✓":sig(s.signals[k])==="n"?"✕":"·"}</i>`).join("");
  const tok=s.tokens||{};
  let h=`<li class="step ${s.live?"":s.ok?"ok":"bad"}"><div><div class="sl"><span class="role role-${esc(s.role)}">${esc(VERB[s.role]||s.role)}</span>${esc(s.rung)} · ${esc(s.model||"")} ${s.live?"<em>(running now)</em>":""}</div>
    <div class="sub"><span class="num">${s.t0?fmtClock(s.t0):""}</span><span class="num">${dur(s.wall_s ?? (s.t1&&s.t0?s.t1-s.t0:null))}</span>
    ${Object.keys(s.signals||{}).length?`<span class="sig">${sg}</span>`:""}
    ${tok.in!=null?`<span class="num">${kfmt(tok.in)} in · ${kfmt(tok.out)} out${tok.cache?` · ${kfmt(tok.cache)} cached`:""}</span>`:""}
    ${s.usd?`<span class="num">$${(+s.usd).toFixed(2)} API-equiv</span>`:""}
    ${s.diff&&s.diff.files?`<span class="num">+${s.diff.add} −${s.diff.del} in ${s.diff.files} file${s.diff.files==1?"":"s"}</span>`:""}
    ${s.mr_result?`<span>model said: <b>${esc(s.mr_result)}</b>${s.confidence!=null?` (${Math.round(s.confidence*100)}% sure)`:""}</span>`:""}
    ${s.escalated_from?`<span>escalated from ${esc(s.escalated_from)}</span>`:""}</div>`;
  if(!s.ok && !s.live){ const m=DATA.failureMeaning[s.failure_class]; h+=`<div class="fail"><b>✕ ${esc(s.failure_class||s.decision||"failed")}</b>${m?` — ${esc(m)}`:""}${s.is_error?" (process error)":""}</div>`; }
  if(s.pushback){ const p=s.pushback; h+=`<div class="push"><b>Pushback (${esc(p.type||"")}):</b> ${esc(p.evidence||"")}${p.proposal?`<br><b>Proposal:</b> ${esc(p.proposal)}`:""}</div>`; }
  h+=toolStrip(s.tools);
  if(s.summary) h+=`<details><summary>Model's last words</summary><div class="said">${esc(s.summary)}</div></details>`;
  if(s.patch||s.raw) h+=`<div class="paths">${s.patch?`patch ${esc(s.patch)}<br>`:""}${s.raw?`raw ${esc(s.raw)}`:""}</div>`;
  return h+"</div></li>";
}
function renderDetail(){
  const t=DATA.traces.find(x=>x.task===state.sel);
  if(!t){ $("#detail").innerHTML=`<div class="empty">Pick a job on the left. Each row's little chart is the job's climb up the model ladder: left to right is time, higher means a more expensive model, red means that attempt failed.</div>`; return; }
  t.steps.forEach((s,i)=>s.idx=i);
  const ladder=(t.ladder||[]).map(r=>`<span class="rg ${t.steps.some(s=>s.rung===r)?"used":""} ${r===t.final_rung&&t.status==="accepted"?"final":""}">${esc(r)}</span>`).join('<span class="arrow">→</span>');
  const fails=[...new Set(t.steps.filter(s=>!s.ok&&!s.live&&s.failure_class).map(s=>s.failure_class))];
  const chrono=[...t.steps.map(s=>({t:s.t0||0,h:stepCard(s)})), ...(t.events||[]).map(e=>({t:e.t||0,h:`<li class="step ev"><div><span class="num">${e.t?fmtClock(e.t):""}</span> ${esc(e.label)}</div></li>`}))].sort((a,b)=>a.t-b.t);
  const src=t.route_sources||{};
  $("#detail").innerHTML=`<div class="wrap">
   <div class="crumb"><span class="num">${esc(t.task)}</span><span>${esc(t.repo||"")}</span><span>${t.t0?esc(fmtWhen(t.t0))+" IST":""}</span>${t.caller?`<span>called by ${esc(t.caller)}</span>`:`<span title="mr does not record the calling agent yet">caller not recorded</span>`}<span>exit ${t.exit??"–"}</span></div>
   <h2 class="title">${t.title?esc(t.title):`<em class="untitled">${esc(t.type||"task")} task in ${esc(t.repo||"?")} <small>(mr kept no title for this task)</small></em>`}</h2>
   <div class="headline h-${esc(t.status)}">${esc(t.headline)}${t.why&&t.status!=="accepted"?`<div class="whyline">${esc(t.why)}</div>`:""}</div>
   <div class="facts"><span>route <b>${esc(t.route||"?")}</b>${src.route?` (${esc(src.route)})`:""}</span><span>type <b>${esc(t.type||"?")}</b></span><span>difficulty <b>${esc(t.difficulty||"?")}</b>${src.difficulty?` (${esc(src.difficulty)})`:""}</span><span>risk <b>${esc(t.risk||"?")}</b></span>
    <span>wall <b class="num">${dur(t.status==="running"?endOf(t)-t.t0:t.wall_s)}</b>${t.time&&t.time.wall_s?` = model <b class="num">${dur(t.time.model_s)}</b> + mr checks <b class="num">${dur(t.time.mr_s)}</b>${t.time.unlogged_s?` + unlogged <b class="num">${dur(t.time.unlogged_s)}</b>`:""}`:""}</span><span title="${esc(costText(t).tip)}">cost <b class="num">${esc(costText(t).txt)}</b></span>${t.cost.claude_pts?`<span>Claude pts <b class="num">${t.cost.claude_pts}</b></span>`:""}<span>tokens <b class="num">${kfmt(t.cost.tok_in)} in / ${kfmt(t.cost.tok_out)} out</b></span>${t.cost.usd_equiv?`<span>API-equiv <b class="num">$${(+t.cost.usd_equiv).toFixed(2)}</b></span>`:""}</div>
   <div class="ladder-legend">ladder ${ladder||"–"}</div>
   <section><h3>The climb</h3><div class="chart">${ladderChart(t)}</div>
   ${fails.length?`<div class="why">${fails.map(f=>`<b>${esc(f)}</b>: ${esc(DATA.failureMeaning[f]||"")}`).join(" · ")}</div>`:""}</section>
   <section><h3>Step by step</h3><ol class="steps">${chrono.map(x=>x.h).join("")}</ol></section></div>`;
}
function select(id){ state.sel=id; history.replaceState(null,"","#"+encodeURIComponent(id)); renderBoard(); renderDetail(); $("#detail").scrollTop=0; if(matchMedia("(max-width:900px)").matches) $("#detail").scrollIntoView({behavior:"smooth"}); }

/* ---------- wiring ---------- */
function init(){
  const repos=[...new Set(DATA.traces.map(t=>t.repo).filter(Boolean))].sort();
  $("#repo").innerHTML=`<option value="">all repos</option>`+repos.map(r=>`<option>${esc(r)}</option>`).join("");
  $("#list").addEventListener("click",e=>{const r=e.target.closest(".row"); if(r) select(r.dataset.t);});
  $("#list").addEventListener("keydown",e=>{const r=e.target.closest(".row"); if(r&&e.key==="Enter") select(r.dataset.t);});
  document.querySelectorAll("[data-f]").forEach(b=>b.addEventListener("click",()=>{state.filter=b.dataset.f;document.querySelectorAll("[data-f]").forEach(x=>x.setAttribute("aria-pressed",x===b));renderBoard();}));
  $("#repo").addEventListener("change",e=>{state.repo=e.target.value;renderBoard();});
  $("#q").addEventListener("input",e=>{state.q=e.target.value;renderBoard();});
  document.addEventListener("keydown",e=>{
    if(e.target.tagName==="INPUT") { if(e.key==="Escape") e.target.blur(); return; }
    if(e.key==="/"){e.preventDefault();$("#q").focus();return;}
    if(e.key!=="j"&&e.key!=="k") return;
    const l=visible(), i=l.findIndex(t=>t.task===state.sel), n=e.key==="j"?Math.min(i+1,l.length-1):Math.max(i-1,0);
    if(l[n]) { select(l[n].task); const el=document.querySelector(`.row[data-t="${CSS.escape(l[n].task)}"]`); el&&el.scrollIntoView({block:"nearest"}); }
  });
  if(!state.sel && DATA.traces.length) state.sel=DATA.traces[0].task;
  renderBoard(); renderDetail();
  const lv=$("#live");
  lv.innerHTML = DATA.live ? `<b></b>live · updated ${fmtClock(DATA.generated)} IST` : `<b></b>snapshot ${esc(fmtWhen(DATA.generated))} IST`;
  lv.classList.toggle("off",!DATA.live);
  if(DATA.live) setInterval(async()=>{
    try{ const r=await fetch("data.json",{cache:"no-store"}); const d=await r.json();
      const changed=d.sig!==DATA.sig; DATA=d; lv.innerHTML=`<b></b>live · updated ${fmtClock(d.generated)} IST`;
      if(changed||d.traces.some(t=>t.status==="running")){ const sc=$("#detail").scrollTop; renderBoard(); renderDetail(); $("#detail").scrollTop=sc; }
    }catch(e){ lv.classList.add("off"); lv.innerHTML="<b></b>live (server unreachable)"; }
  }, 4000);
}
document.readyState==="loading"?document.addEventListener("DOMContentLoaded",init):init();
})();
</script></body></html>
