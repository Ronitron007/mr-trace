version: 1
# mr-trace build (31 Oct 2026, Outbox). cursor-agent was logged out at 01:06 IST, so easy code goes to Sonnet (S); Composer reviews grok.
rungs:
  G-x: {model: grok-4.7-xhigh-fast, path: cursor}
ladders:
  code: {trivial: [S], easy: [S], medium: [G-h, G-x], hard: [G-h, G-x], critical: [G-h, G-x]}
  test: {trivial: [G-h, G-x], easy: [G-h, G-x], medium: [G-h, G-x], hard: [G-h, G-x], critical: [G-h, G-x]}
hygiene:
  commands:
    mr-trace: ["python3 -m unittest discover -s tests -t ."]
acceptance:
  runners: {mr-trace: unittest}
  default: unittest
planner: {rungs: {trivial: G-h, easy: G-h, medium: G-h, hard: G-h, critical: G-h}, claude_denied: G-h}
review: {map: {grok: C25, kimi: G-h, composer: G-h, claude: G-x}, high_risk_grok: C25, tiebreak: C25, claude_denied: C25}
advisor: {mode: off}
timeouts: {planner_s: 900, rung_s: {cursor: 1500, claude: 900}}
